<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление пользователями</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>🛡️ HSE Portal</h1>
        <div class="header-actions">
            <a href="dashboard.html" class="btn btn-secondary">← Назад</a>
            <button class="btn btn-danger" onclick="handleLogout()">Выход</button>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h2>Управление пользователями</h2>
        </div>

        <div class="info-box">
            💡 <strong>Подсказка:</strong> Создание и удаление пользователей выполняется через панель Supabase (Authentication → Users). Здесь вы можете только просматривать список и менять роли.
        </div>

        <table id="users-table">
            <thead>
                <tr>
                    <th>Имя</th>
                    <th>Email</th>
                    <th>Роль</th>
                    <th>Последний вход</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="users-body">
                <tr><td colspan="5" style="text-align:center; padding:2rem; color:#7f8c8d;">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        
        // ⚠️ ЗАМЕНИТЕ НА ВАШИ ЗНАЧЕНИЯ
        const SUPABASE_URL = 'https://xtvfliynzoqscbfsdejj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0dmZsaXluem9xc2NiZnNkZWpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjAzODYsImV4cCI6MjEwODgzNjM4Nn0._fslUCBVos6btO819t_GYQfdPiuWRbczR7AfhpJXZ8E';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Проверка прав доступа
        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            const role = localStorage.getItem('user_role');
            if (role !== 'admin') {
                alert('Доступ только для администраторов');
                window.location.href = 'dashboard.html';
                return;
            }

            loadUsers();
        }

        // ✅ ЗАГРУЗКА ПОЛЬЗОВАТЕЛЕЙ (через RPC-функцию)
        async function loadUsers() {
            const { data, error } = await supabase.rpc('get_all_users');

            if (error) {
                console.error('Ошибка загрузки:', error);
                document.getElementById('users-body').innerHTML = 
                    '<tr><td colspan="5" style="text-align:center; padding:2rem; color:#e74c3c;">Ошибка: ' + error.message + '</td></tr>';
                return;
            }

            const tbody = document.getElementById('users-body');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:2rem; color:#7f8c8d;">Нет пользователей</td></tr>';
                return;
            }

            const currentUserId = localStorage.getItem('user_id');

            tbody.innerHTML = data.map(user => {
                const lastSignIn = user.last_sign_in_at 
                    ? new Date(user.last_sign_in_at).toLocaleString('ru-RU')
                    : '—';
                const isSelf = user.id === currentUserId;
                
                return `
                    <tr>
                        <td>${user.full_name || '—'} ${isSelf ? '(вы)' : ''}</td>
                        <td>${user.email}</td>
                        <td>
                            <span class="role-badge role-${user.role || 'user'}">
                                ${getRoleName(user.role)}
                            </span>
                        </td>
                        <td>${lastSignIn}</td>
                        <td class="actions">
                            <select onchange="changeRole('${user.id}', this.value)" 
                                    ${isSelf ? 'disabled' : ''}>
                                <option value="user" ${user.role === 'user' ? 'selected' : ''}>Пользователь</option>
                                <option value="engineer" ${user.role === 'engineer' ? 'selected' : ''}>Инженер</option>
                                <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Администратор</option>
                            </select>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getRoleName(role) {
            const names = {
                admin: 'Админ',
                engineer: 'Инженер',
                user: 'Пользователь'
            };
            return names[role] || 'Пользователь';
        }

        // Смена роли
        window.changeRole = async function(userId, newRole) {
            if (!confirm(`Сменить роль на "${getRoleName(newRole)}"?`)) {
                loadUsers();
                return;
            }
            
            const { error } = await supabase.rpc('update_user_role', {
                target_user_id: userId,
                new_role: newRole
            });

            if (error) {
                alert('Ошибка: ' + error.message);
            } else {
                loadUsers();
            }
        };

        window.handleLogout = async function() {
            await supabase.auth.signOut();
            localStorage.clear();
            window.location.href = 'index.html';
        };

        init();
    </script>
</body>
</html>
